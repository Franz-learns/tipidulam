<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recipes · TipidUlam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header id="app-nav"></header>
<main class="container py-4" style="max-width: 1100px;">
  <h1 class="h3 mb-1">Recipes</h1>
  <p class="text-secondary mb-4">Costs are for your household size and include rice where it's served with rice.</p>

  <div class="row g-2 mb-3">
    <div class="col-md-6"><input id="search" class="form-control" type="search" placeholder="Search ulam or ingredient (e.g. kangkong)"></div>
    <div class="col-6 col-md-3"><select id="filterType" class="form-select">
      <option value="">All meals</option><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option>
    </select></div>
    <div class="col-6 col-md-3"><select id="sortBy" class="form-select">
      <option value="cost">Cheapest first</option><option value="ready">Most ready to cook</option><option value="name">A–Z</option>
    </select></div>
  </div>
  <div id="recipeGrid" class="row g-3"></div>

  <div class="modal fade" id="recipeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg"><div class="modal-content">
      <div class="modal-header"><h2 class="modal-title h5" id="modalTitle"></h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="modalBody"></div>
    </div></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/recipes.js"></script>
</body>
</html>
