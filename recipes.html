<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#047857">
  <title>Recipes · TipidUlam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header id="app-nav"></header>
<main class="app-main"><div class="app-container">
  <div class="page-head">
    <span class="eyebrow"><span data-icon="book-open" data-size="14"></span>Lutong bahay</span>
    <h1>Recipes</h1>
    <p>Costs are for your household size, with rice included where it's served with rice.</p>
  </div>

  <div class="row g-2 mb-3">
    <div class="col-md-6">
      <label class="visually-hidden" for="search">Search recipes</label>
      <div class="search-wrap"><span data-icon="search"></span><input id="search" class="form-control" type="search" placeholder="Search ulam or ingredient, e.g. kangkong"></div>
    </div>
    <div class="col-6 col-md-3">
      <label class="visually-hidden" for="filterType">Meal type</label>
      <select id="filterType" class="form-select">
        <option value="">All meals</option><option value="breakfast">Breakfast</option><option value="lunch">Lunch</option><option value="dinner">Dinner</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <label class="visually-hidden" for="sortBy">Sort</label>
      <select id="sortBy" class="form-select">
        <option value="cost">Cheapest first</option><option value="ready">Most ready to cook</option><option value="name">A–Z</option>
      </select>
    </div>
  </div>
  <div class="d-flex flex-wrap gap-2 mb-3" id="groupChips" role="radiogroup" aria-label="Filter by category"></div>
  <p class="small text-secondary mb-2" id="resultCount" aria-live="polite"></p>
  <div id="recipeGrid" class="row g-3"></div>

  <div class="modal fade" id="recipeModal" tabindex="-1" aria-labelledby="modalTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered modal-lg"><div class="modal-content">
      <div class="modal-header">
        <div class="modal-hero" id="modalHero"></div>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div></div>
  </div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/recipes.js"></script>
</body>
</html>
