<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · TipidUlam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header id="app-nav"></header>
<main class="container py-4" style="max-width: 1100px;">
  <h1 class="h3 mb-1">Magandang araw!</h1>
  <p class="text-secondary mb-4">Your week at a glance: budget, today's meals, and what needs cooking first.</p>

  <section class="card mb-4"><div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 mb-0">This week's budget</h2>
      <a class="btn btn-sm btn-outline-secondary" data-link href="settings.html">Edit</a>
    </div>
    <div id="budgetStats" class="row g-3 text-center"></div>
    <div class="progress mt-3" style="height: 10px;" id="budgetBar"></div>
    <p id="budgetNote" class="small text-secondary mt-2 mb-0"></p>
  </div></section>

  <div class="row g-4">
    <div class="col-lg-6">
      <section class="card h-100"><div class="card-body">
        <h2 class="h5">Today's meals</h2>
        <div id="todayMeals"></div>
      </div></section>
    </div>
    <div class="col-lg-6">
      <section class="card h-100"><div class="card-body">
        <h2 class="h5">Use these first</h2>
        <ul id="expiringList" class="list-group list-group-flush"></ul>
      </div></section>
    </div>
  </div>

  <section class="card mt-4"><div class="card-body">
    <h2 class="h5">You can cook now</h2>
    <div id="cookNow" class="row g-3"></div>
  </div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
