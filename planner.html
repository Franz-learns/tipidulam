<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meal Plan · TipidUlam</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header id="app-nav"></header>
<main class="container py-4" style="max-width: 1100px;">
  <h1 class="h3 mb-1">Weekly Meal Plan</h1>
  <p class="text-secondary mb-4">Set your budget and household size, then generate 7 days of ulam that fit. Pantry items are used first.</p>

  <section class="card mb-4"><div class="card-body">
    <form id="planForm" class="row g-3 align-items-end">
      <div class="col-sm-6 col-lg-3">
        <label class="form-label" for="budget">Weekly budget (₱)</label>
        <input class="form-control" id="budget" type="number" min="100" step="50" required>
      </div>
      <div class="col-sm-6 col-lg-2">
        <label class="form-label" for="household">Household size</label>
        <input class="form-control" id="household" type="number" min="1" max="20" required>
      </div>
      <div class="col-sm-8 col-lg-4">
        <span class="form-label d-block">Meals per day</span>
        <div id="mealTypes"></div>
      </div>
      <div class="col-sm-4 col-lg-3 d-grid">
        <button class="btn btn-tipid" type="submit">Generate plan</button>
      </div>
    </form>
  </div></section>

  <section id="planSummary" class="card mb-4 d-none"><div class="card-body d-flex flex-wrap gap-4 align-items-center"></div></section>
  <div id="planGrid" class="row g-3"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/planner.js"></script>
</body>
</html>
