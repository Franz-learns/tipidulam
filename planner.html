<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#047857">
  <title>Meal Plan · TipidUlam</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Rubik:wght@500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header id="app-nav"></header>
<main class="app-main"><div class="app-container">
  <div class="page-head">
    <span class="eyebrow"><span data-icon="calendar-days" data-size="14"></span>Weekly plan</span>
    <h1>Meal Plan</h1>
    <p>Set your budget and household, then generate 7 days of ulam that fit. Pantry items are used first.</p>
  </div>

  <section class="card surface-pad mb-4">
    <form id="planForm" class="row g-3 align-items-end">
      <div class="col-6 col-lg-3">
        <label class="form-label" for="budget">Weekly budget (₱)</label>
        <input class="form-control" id="budget" type="number" min="100" step="50" inputmode="numeric" required>
      </div>
      <div class="col-6 col-lg-2">
        <label class="form-label" for="household">Household size</label>
        <input class="form-control" id="household" type="number" min="1" max="20" inputmode="numeric" required>
      </div>
      <fieldset class="col-12 col-lg-4 m-0">
        <legend class="form-label mb-1">Meals per day</legend>
        <div id="mealTypes" class="d-flex flex-wrap gap-2"></div>
      </fieldset>
      <div class="col-12 col-lg-3 d-grid">
        <button class="btn btn-tipid" type="submit"><span data-icon="sparkles"></span>Generate plan</button>
      </div>
    </form>
  </section>

  <section id="planSummary" class="mb-4 d-none"></section>
  <div id="planGrid" class="row g-3"></div>
</div></main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="js/pages/planner.js"></script>
</body>
</html>
